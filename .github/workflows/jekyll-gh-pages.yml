name: Build and deploy UESL to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: Gemfile.local
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Install Python dependencies
        run: |
          python -m venv venv  # Create virtual environment
          source venv/bin/activate  # Activate the virtual environment
          pip install -r requirements.txt  # Install Python packages

      - name: Execute notebook conversion script
        run: |
          source venv/bin/activate  # Activate virtual environment
          python -m scripts.convert_notebooks  # Run notebook conversion
          
      - name: Execute DOCX conversion script
        run: |
          source venv/bin/activate  # Activate virtual environment
          if [ -d "_docx" ] && [ "$(ls -A _docx 2>/dev/null)" ]; then
            echo "Converting DOCX files..."
            python scripts/convert_docx.py  # Run DOCX conversion
          else
            echo "No DOCX files found, skipping conversion"
          fi

      - name: Split multi-course files
        run: |
          source venv/bin/activate  # Activate virtual environment
          python scripts/split_multi_course_files.py  # Run course splitting
      - name: Build with Jekyll
        run: |
          bundle exec jekyll build --config _config.yml,_config.local.yml,_config.pages.yml
          python -m unittest discover -s tests -p test_prefix_site_urls.py
          python -m unittest discover -s tests -p test_deployed_editor.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages-deployment
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
