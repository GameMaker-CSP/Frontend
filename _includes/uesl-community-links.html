{% for path in site.minima.nav_pages %}
  {% assign item = site.pages | where: "path", path | first %}
  {% if item %}
    <li><a class="ocs__btn{% if page.url == item.url %} accent{% endif %}" href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.nav_title | default: item.title | escape }}</a></li>
  {% endif %}
{% endfor %}
