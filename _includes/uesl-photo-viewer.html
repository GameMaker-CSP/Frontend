<dialog id="photo-viewer" class="ocs__card" aria-labelledby="photo-viewer-caption">
  <form method="dialog" class="ocs__stack">
    <button class="ocs__btn" autofocus>Close photo</button>
    <img class="ocs__image-frame" alt="">
    <p id="photo-viewer-caption" data-photo-caption></p>
    <p class="ocs__callout" data-photo-failed hidden>This photo could not be loaded.</p>
  </form>
</dialog>
