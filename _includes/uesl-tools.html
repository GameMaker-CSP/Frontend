<div id="reading-ruler" aria-hidden="true" hidden></div>
<dialog id="tk-friends-panel" class="ocs__card" aria-labelledby="active-friends-title">
  <div class="ocs__stack">
    <h2 id="active-friends-title" class="ocs__section-title">Active friends</h2>
    <div id="tk-friends-list" class="ocs__stack" role="status">Loading…</div>
    <form method="dialog"><button class="ocs__btn">Close</button></form>
  </div>
</dialog>
<dialog id="uesl-chat-window" class="ocs__card" aria-labelledby="coach-title">
  <div class="ocs__stack">
    <div class="ocs__links"><h2 id="coach-title" class="ocs__section-title">UESL Coach</h2><button id="uesl-chat-close" class="ocs__btn">Close</button></div>
    <div id="uesl-chat-messages" class="ocs__stack" aria-live="polite"><p class="ocs__description">Ask about UESL locations, joining, or games.</p></div>
    <label class="ocs__field" for="uesl-chat-input">Your question<input class="ocs__input" id="uesl-chat-input" type="text" autocomplete="off" maxlength="300"></label>
    <button id="uesl-chat-send" class="ocs__btn accent">Send question</button>
  </div>
</dialog>
