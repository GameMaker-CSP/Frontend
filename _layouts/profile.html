---
layout: ocs-account
---
<p id="accountStatus" role="status"></p>
<div id="profileContent" class="ocs__stack" hidden>
<p class="ocs__description">Choose the name you want to use and revisit your play preferences anytime.</p>
    <form class="ocs__card ocs__stack" id="profileSettingsForm" aria-labelledby="account" novalidate>
        <div class="ocs__links">
            <h2 class="ocs__section-title" id="account">Account</h2>
            <div class="ocs__links">
                <p class="ocs__text" id="saveStatus" role="status"></p>
                <button type="submit" class="ocs__btn accent fill" id="saveChangesBtn" disabled>Save changes</button>
            </div>
        </div>
        <div class="ocs__grid cols-2">
            <div class="ocs__field">
                <label class="ocs__label" for="nameChangeInput">Display name</label>
                <input class="ocs__input" type="text" id="nameChangeInput" name="name" autocomplete="nickname">
            </div>
            <div class="ocs__field">
                <label class="ocs__label" for="uidChangeInput">User ID</label>
                <input class="ocs__input" type="text" id="uidChangeInput" name="uid" autocomplete="username"
                    autocapitalize="none" spellcheck="false" aria-describedby="uidHelp">
                <small id="uidHelp">Your Game Maker username. Changing it signs you out.</small>
            </div>
            <div class="ocs__field">
                <label class="ocs__label" for="emailChangeInput">Email</label>
                <input class="ocs__input" type="email" id="emailChangeInput" name="email" autocomplete="email" spellcheck="false">
            </div>
        </div>
    </form>
<section class="ocs__card ocs__stack" aria-labelledby="surveySummaryTitle">
  <h2 class="ocs__section-title" id="surveySummaryTitle">Your play preferences</h2>
  <p id="surveySummary" role="status">Loading your choices…</p>
  <a class="ocs__btn" href="{{ '/survey' | relative_url }}">Edit play preferences</a>
</section>
<button class="ocs__btn" id="accountLogout" type="button">Log out</button>
</div>
<script type="module" src="{{ '/assets/js/profile/account-page.js' | relative_url }}"></script>
